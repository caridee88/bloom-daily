<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bloom Daily</title>
 <link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root{--ice:#dcecf7;--ice2:#bcd9ee;--cream:#fffaf2;--peach:#f7b7a3;--lav:#e6dcf5;--ink:#5a5470}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang TC",sans-serif;background:linear-gradient(180deg,#e6f2fb 0%,#fffaf2 40%,#fdebe5 100%) fixed;min-height:100vh}
#app{max-width:430px;margin:0 auto;padding:18px 14px 120px}
h2{margin:8px 0 14px;text-align:center;color:#7d6aa8;letter-spacing:1px}
h3{margin:6px 0}
.card{position:relative;background:#fff;border:2px solid #fff;border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px #c9b8e855,0 2px 6px #bcd9ee66}
.card.done{background:linear-gradient(135deg,#efe6fb,#fff3ee);border-color:#e6dcf5}
.card.done::after{content:"🌸";position:absolute;top:-9px;left:12px;font-size:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar{height:16px;border-radius:99px;background:var(--ice);overflow:hidden;box-shadow:inset 0 1px 3px #bcd9ee}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd0c0,#f7a98f,#d9c6f2);transition:width .4s}
button{border:0;border-radius:99px;padding:10px 18px;background:linear-gradient(180deg,#d5e9f8,#bcd9ee);color:var(--ink);font-size:15px;font-family:inherit;font-weight:600;box-shadow:0 3px 0 #a9c9e2;transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(3px) scale(.97);box-shadow:0 0 0 #a9c9e2}
button.main{background:linear-gradient(180deg,#ffd3c4,#f7b09a);box-shadow:0 3px 0 #e79a84;color:#6b3f35}
button.main:active{box-shadow:0 0 0 #e79a84}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--ice);border-radius:18px;margin:6px 0;font-size:16px;background:#fffdf9;color:var(--ink);font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--peach)}
.chip{display:inline-block;padding:7px 14px;border-radius:99px;background:var(--ice);margin:3px;font-size:14px;font-weight:600}
.chip.on{background:linear-gradient(180deg,#ffd3c4,#f7b7a3)}
.em{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#e6f2fb,#f1e8fb);font-size:22px;margin-right:6px;vertical-align:middle}
.c{text-align:center}.sm{font-size:13px;opacity:.7}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#dcecf7;border-radius:28px 28px 0 0;border-top:3px solid #bcd9ee;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
nav div{display:flex;max-width:430px;width:100%}
nav button{flex:1;min-width:0;white-space:nowrap;background:none;box-shadow:none;border-radius:0;font-size:11px;padding:6px 0;color:#7a8ba3;font-weight:600}
nav button:active{transform:scale(.92);box-shadow:none;background:none}
nav button b{display:block;font-size:24px;margin-bottom:2px;opacity:.55}
nav button.on{color:#5a5470;background:none}
nav button.on b{opacity:1}
nav button.on::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:#f7b09a;margin:4px auto 0}
/* 小卡商店 */
</style>
<link rel="stylesheet" href="./card-shop/shop.css">
<link rel="stylesheet" href="./stats/stats.css">
</head><body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script src="./card-shop/cards.js"></script>
<script src="./card-shop/shop.js"></script>
<script src="./stats/stats.js"></script>
<script>
window.onerror=function(m,s,l){document.getElementById('app').innerHTML='<pre style="padding:20px;white-space:pre-wrap;color:red">錯誤：'+m+' (行 '+l+')</pre>'};
const HABITS=[
{id:'exercise',n:'運動',e:'🧘🏻‍♀️',xp:20,f:'exercise'},
{id:'english',n:'學英文',e:'📖',xp:15,f:'min'},
{id:'japanese',n:'學日文',e:'🍡',xp:15,f:'min'},
{id:'sleep',n:'睡眠品質',e:'🌙',xp:10,f:'sleep'},
{id:'taxi',n:'今日沒有坐計程車',e:'🚕',xp:10},
{id:'tea',n:'今日沒有買手搖',e:'🧋',xp:10},
{id:'book',n:'看書',e:'📚',xp:15,f:'book'}];
const QUOTES=[
{zh:'慢慢來，花也是一天一天開的。',en:'Take your time. Flowers bloom one day at a time.',ja:'ゆっくりでいいよ。花も一日ずつ咲くから。'},
{zh:'今天的你，已經很棒了。',en:'You are doing great today.',ja:'今日のあなたはもう十分すばらしいよ。'},
{zh:'小小的進步，也值得被慶祝。',en:'Even small progress deserves a celebration.',ja:'小さな一歩も、お祝いする価値があるよ。'},
{zh:'深呼吸，一切都會慢慢變好。',en:'Breathe in. Things will slowly get better.',ja:'深呼吸して。きっと少しずつ良くなるよ。'},
{zh:'做自己，就是最好的風景。',en:'Being yourself is the best scenery.',ja:'あなたらしさが、いちばんの景色だよ。'}];
const PLACES=[
{id:'santorini',name:'聖托里尼',country:'希臘',lat:36.39,lon:25.46,story:'白色屋舍沿著火山破火山口的懸崖層層排列，是愛琴海最具代表性的風景之一。',fact:'島嶼的形狀來自史前一次大規模火山噴發。'},
{id:'fushimi',name:'伏見稻荷大社',country:'日本',lat:34.967,lon:135.773,story:'位於京都，以綿延山路上的朱紅鳥居聞名，自古是祈求商業與豐收的神社。',fact:'山徑上的鳥居數量以千計，多由企業與個人奉納。'},
{id:'machu',name:'馬丘比丘',country:'秘魯',lat:-13.163,lon:-72.545,story:'15 世紀印加帝國興建的山城，坐落於安地斯山脈高處，石造建築精密。',fact:'許多石塊切割得相當精準，不使用灰漿也能緊密相接。'},
{id:'louise',name:'路易斯湖',country:'加拿大',lat:51.417,lon:-116.218,story:'位於洛磯山脈班夫國家公園，被冰川環繞，湖水呈現夢幻的青綠色。',fact:'湖水顏色來自冰川磨出的細微岩粉散射光線。'},
{id:'petra',name:'佩特拉',country:'約旦',lat:30.329,lon:35.444,story:'納巴泰人的古城，建築直接鑿刻在粉紅色砂岩峭壁上。',fact:'它曾是古代香料貿易路線上的重要城市。'}];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;
try{S=JSON.parse(localStorage.getItem('bloom')||'null')}catch(_){S=null}
S=S||{days:{},books:[],favQ:[],places:[],lastQ:null,lastP:null};
const save=(state=S)=>{try{localStorage.setItem('bloom',JSON.stringify(state));return true}catch(_){return false}};
const key=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const rd=k=>S.days[k||key()]||{};
const wr=()=>S.days[key()]||(S.days[key()]={});
const count=k=>HABITS.filter(h=>rd(k)[h.id]).length;
const xp=k=>HABITS.filter(h=>rd(k)[h.id]).reduce((a,h)=>a+h.xp,0);
let tab='today',open=null,newBook=false,shelf='reading',finishing=null,slow=false;

function render(){
 const T=[['today','♡','今日'],['stats','▥','統計'],['quote','💌','話語'],['world','🌍','世界'],['shelf','📚','書櫃'],['shop','🐾','小卡商店']];
 $('#nav').innerHTML=T.map(t=>'<button type="button" class="'+(tab==t[0]?'on':'')+'"'+(tab==t[0]?' aria-current="page"':'')+' data-a="tab" data-v="'+t[0]+'"><b aria-hidden="true">'+t[1]+'</b>'+t[2]+'</button>').join('');
 const views={today:vToday,stats:vStats,quote:vQuote,world:vWorld,shelf:vShelf,shop:cardShop.render};
 $('#app').innerHTML=views[tab]();
}

/* ---------- 今日 ---------- */
function form(h){
 const d=rd()[h.id]||{};
 if(h.f=='exercise'){
  const ty=d.types||[];
  const chips=['瑜珈','跳舞','其他'].map(t=>'<label class="chip"><input type="checkbox" class="ex" value="'+t+'" '+(ty.includes(t)?'checked':'')+' style="width:auto;margin:0 4px 0 0">'+t+'</label>').join('');
  return '<div>'+chips+'<input id="exo" placeholder="其他運動名稱" value="'+esc(d.other||'')+'"><input id="min" type="number" inputmode="numeric" placeholder="運動分鐘數" value="'+(d.min||'')+'"></div>';
 }
 if(h.f=='min')return '<input id="min" type="number" inputmode="numeric" placeholder="今日學習分鐘數" value="'+(d.min||'')+'">';
 if(h.f=='sleep'){
  const opts=[1,2,3,4,5].map(n=>'<option '+(d.q==n?'selected':'')+' value="'+n+'">品質 '+n+' 分</option>').join('');
  return '<input id="hrs" type="number" step="0.5" inputmode="decimal" placeholder="昨晚睡眠時數" value="'+(d.hrs||'')+'"><select id="q">'+opts+'</select>';
 }
 if(h.f=='book'){
  const rb=S.books.filter(b=>b.status=='reading');
  if(rb.length&&!newBook){
   const opts=rb.map(b=>'<option '+(d.title==b.title?'selected':'')+'>'+esc(b.title)+'</option>').join('');
   return '<select id="bsel">'+opts+'</select><button data-a="newbook">輸入新書名</button>';
  }
  return '<input id="bnew" placeholder="輸入新書名">'+(rb.length?'<button data-a="oldbook">選擇閱讀中的書</button>':'');
 }
 return '';
}
function vToday(){
 const n=count(),p=Math.round(n/7*100);
 let html='<h2>Bloom Daily ♡</h2><div class="card c"><div class="sm">'+key()+'</div><h3>'+n+' / 7　·　'+p+'%</h3>'
 +'<div class="bar"><i style="width:'+p+'%"></i></div><p>今日喵幣：'+xp()+'</p>'+cardShop.walletSummary()
 +'<span class="chip '+(n>=2?'on':'')+'">💌 話語 '+(n>=2?'已解鎖':'完成 2 項解鎖')+'</span>'
 +'<span class="chip '+(n>=3?'on':'')+'">🌍 世界 '+(n>=3?'已解鎖':'完成 3 項解鎖')+'</span></div>';
 HABITS.forEach(h=>{
  const done=!!rd()[h.id];
  let btn;
  if(h.f)btn='<button data-a="open" data-v="'+h.id+'">'+(open==h.id?'收合':'展開')+'</button>';
  else btn='<button class="'+(done?'':'main')+'" data-a="toggle" data-v="'+h.id+'">'+(done?'取消':'完成')+'</button>';
  let body='';
  if(open==h.id){
   body='<div style="margin-top:8px">'+form(h)+'<div class="row" style="margin-top:6px"><button class="main" data-a="save" data-v="'+h.id+'">'+(h.f=='book'?'完成今日看書':'儲存打卡')+'</button>'
   +(done?'<button data-a="toggle" data-v="'+h.id+'">取消打卡</button>':'')+'</div></div>';
  }
  html+='<div class="card '+(done?'done':'')+'"><div class="row"><div><span class="em">'+h.e+'</span>'+h.n+'<div class="sm">'+h.xp+' 喵幣'+(done?' · 已完成':'')+'</div></div>'+btn+'</div>'+body+'</div>';
 });
 return html;
}
function saveHabit(id){
 const g=s=>document.querySelector(s),d={};
 if(id=='exercise'){d.types=[...document.querySelectorAll('.ex:checked')].map(x=>x.value);d.other=g('#exo').value.trim();d.min=+g('#min').value||0;
  if(!d.types.length)return alert('請至少選一種運動');}
 if(id=='english'||id=='japanese'){d.min=+g('#min').value||0;if(!d.min)return alert('請輸入分鐘數');}
 if(id=='sleep'){d.hrs=+g('#hrs').value||0;d.q=+g('#q').value;if(!d.hrs)return alert('請輸入睡眠時數');}
 if(id=='book'){
  const nb=g('#bnew'),title=(nb?nb.value:g('#bsel').value).trim();
  if(!title)return alert('請輸入或選擇書名');
  const ex=S.books.find(b=>b.title.toLowerCase()==title.toLowerCase());
  if(ex&&ex.status=='done')return alert('這本書已經讀完囉，會保留在書櫃的「已讀完」。');
  if(!ex)S.books.push({title:title,status:'reading',note:'',added:key()});
  d.title=ex?ex.title:title;newBook=false;}
 wr()[id]=d;save();open=null;render();
}

/* ---------- 統計頁入口 ---------- */
function vStats(){
 if(typeof bloomStats==='undefined'){
  return '<h2>統計</h2><div class="card c">統計頁暫時無法載入。請確認 stats/stats.js 已上傳，再重新整理。</div>';
 }
 return bloomStats.render({days:S.days, habits:HABITS, dateKey:key, escape:esc});
}

/* ---------- 話語 ---------- */
function speak(txt,lang,cb){const u=new SpeechSynthesisUtterance(txt);u.lang=lang;u.rate=slow?0.6:0.9;if(cb)u.onend=cb;speechSynthesis.speak(u)}
function vQuote(){
 if(count()<2)return '<h2>💌 話語</h2><div class="card c">🔒 今日完成 2 項習慣就能解鎖<br>目前 '+count()+' / 7</div>';
 const q=QUOTES[S.lastQ];
 let html='<h2>💌 話語</h2><div class="card c">';
 if(q){
  html+='<p style="font-size:18px">'+q.zh+'</p><p>'+q.en+'</p><p>'+q.ja+'</p>'
  +'<button data-a="say" data-v="en">🔊 英文</button> <button data-a="say" data-v="ja">🔊 日文</button> <button data-a="say" data-v="both">英→日</button>'
  +'<p><button data-a="slow" class="'+(slow?'main':'')+'">🐢 慢速</button> <button data-a="fav">'+(S.favQ.includes(S.lastQ)?'❤️ 已收藏':'🤍 收藏')+'</button></p>';
 }else html+='<p>抽一句今天的話語吧</p>';
 html+='<button class="main" data-a="drawq">'+(q?'再抽一句':'抽一句')+'</button></div>';
 if(S.favQ.length)html+='<div class="card"><b>我的收藏</b>'+S.favQ.map(i=>'<p>'+QUOTES[i].zh+'<br><span class="sm">'+QUOTES[i].en+'</span></p>').join('')+'</div>';
 return html;
}

/* ---------- 世界 ---------- */
function map(pts){
 const W=360,H=180;let g='';
 for(let x=0;x<=W;x+=30)g+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="#fff" stroke-width=".6"/>';
 for(let y=0;y<=H;y+=30)g+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#fff" stroke-width=".6"/>';
 const dots=pts.map(p=>'<circle cx="'+(p.lon+180)+'" cy="'+(90-p.lat)+'" r="4" fill="#f7b7a3" stroke="#fff" stroke-width="1.5"/>').join('');
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="border-radius:14px;background:#dcecf7">'+g+dots+'</svg>';
}
function placeCard(p){
 return '<div class="card"><div style="height:140px;border-radius:14px;background:var(--lav);display:flex;align-items:center;justify-content:center" class="sm">📷 照片待授權配對</div>'
 +'<h3>'+p.name+' <span class="sm">'+p.country+'</span></h3><p>'+p.story+'</p><p>✨ <b>你知道嗎？</b><br>'+p.fact+'</p><b>📍 它在地球的哪裡？</b>'+map([p])+'</div>';
}
function vWorld(){
 if(count()<3)return '<h2>🌍 世界</h2><div class="card c">🔒 今日完成 3 項習慣就能解鎖<br>目前 '+count()+' / 7</div>';
 const col=S.places.map(id=>PLACES.find(p=>p.id==id)).filter(Boolean),cur=PLACES.find(p=>p.id==S.lastP);
 let html='<h2>🌍 世界</h2><div class="c" style="margin-bottom:12px"><button class="main" data-a="drawp">抽一張世界美景</button></div>';
 if(cur)html+=placeCard(cur);
 html+='<div class="card"><b>我的世界足跡地圖</b>'+map(col)+'<p class="sm c">已探索 '+col.length+' 個景點 · '+new Set(col.map(p=>p.country)).size+' 個國家／地區<br>「點亮」代表在 App 抽到，不代表實際到訪</p></div>';
 col.forEach(p=>{html+='<div class="card"><div class="row"><div><b>'+p.name+'</b><div class="sm">'+p.country+'</div></div><button data-a="viewp" data-v="'+p.id+'">重讀</button></div></div>';});
 return html;
}

/* ---------- 書櫃 ---------- */
function vShelf(){
 const list=S.books.filter(b=>b.status==shelf);
 let html='<h2>📚 書櫃</h2><div class="c"><button class="'+(shelf=='reading'?'main':'')+'" data-a="shelf" data-v="reading">閱讀中</button> <button class="'+(shelf=='done'?'main':'')+'" data-a="shelf" data-v="done">已讀完</button></div><br>';
 if(!list.length)return html+'<div class="card c sm">還沒有書。到「今日 → 看書」輸入新書名即可加入。</div>';
 list.forEach(b=>{
  html+='<div class="card"><b>'+esc(b.title)+'</b>';
  if(shelf=='reading'){
   if(finishing==b.title)html+='<textarea id="note" rows="4" placeholder="最有感觸的一件事"></textarea><button class="main" data-a="finish" data-v="'+esc(b.title)+'">完成閱讀並收藏</button>';
   else html+='<p><button data-a="fin" data-v="'+esc(b.title)+'">♡ 我讀完這本書了</button></p>';
  }else html+='<p class="sm">'+esc(b.note||'（沒有留下心得）')+'</p>';
  html+='</div>';
 });
 return html;
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
 if(a=='tab'){
  if(tab!==v){scrollTo(0,0);cardShop.resetSelection()}
  tab=v;
 }
 else if(a.startsWith('shop-'))return cardShop.handleAction(a,v);
 else if(a=='open'){open=open==v?null:v;newBook=false}
 else if(a=='toggle'){const d=wr();if(d[v])delete d[v];else d[v]={};save()}
 else if(a=='save')return saveHabit(v);
 else if(a=='newbook'){newBook=true}else if(a=='oldbook'){newBook=false}
 else if(a=='drawq'){S.lastQ=Math.floor(Math.random()*QUOTES.length);save()}
 else if(a=='fav'){const i=S.favQ.indexOf(S.lastQ);i<0?S.favQ.push(S.lastQ):S.favQ.splice(i,1);save()}
 else if(a=='slow'){slow=!slow}
 else if(a=='say'){const q=QUOTES[S.lastQ];speechSynthesis.cancel();
  if(v=='en')speak(q.en,'en-US');else if(v=='ja')speak(q.ja,'ja-JP');else speak(q.en,'en-US',function(){speak(q.ja,'ja-JP')});return}
 else if(a=='drawp'){const p=PLACES[Math.floor(Math.random()*PLACES.length)];S.lastP=p.id;if(!S.places.includes(p.id))S.places.push(p.id);save()}
 else if(a=='viewp'){S.lastP=v;scrollTo(0,0)}
 else if(a=='shelf'){shelf=v;finishing=null}
 else if(a=='fin'){finishing=v}
 else if(a=='finish'){const b=S.books.find(b=>b.title==v);b.status='done';b.note=document.querySelector('#note').value.trim();b.doneOn=key();finishing=null;save()}
 else if(a=='export'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='bloom-backup-'+key()+'.json';l.click();return}
 else if(a=='import'){document.querySelector('#imp').click();return}
 render();
});
document.addEventListener('change',function(e){
 if(e.target.id=='imp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=function(){try{S=JSON.parse(r.result);save();render();alert('已還原')}catch(_){alert('檔案格式錯誤')}};r.readAsText(f)}
});
render();
</script><script>
PLACES.push(...[
['taj','泰姬瑪哈陵','印度',27.175,78.042,'Taj Mahal','蒙兀兒皇帝沙賈汗為紀念愛妻而建的白色大理石陵墓，是印度最具代表性的建築。','建造前後花了二十多年，據說在清晨與黃昏的光線下會呈現不同的色調。'],
['greatwall','八達嶺長城','中國',40.36,116.02,'Great Wall of China','長城由不同朝代陸續修築，沿著北方山脊蜿蜒，八達嶺是最常被造訪的一段。','今日最知名的城牆多半是明朝時期修建或重修的。'],

(function(){
var W0={santorini:'Santorini',fushimi:'Fushimi Inari-taisha',machu:'Machu Picchu',louise:'Lake Louise (Alberta)',petra:'Petra'};

var landPath='',landState=0,WK={},showN=30;
function wikiOf(p){return p.wiki||W0[p.id]||p.name}

function loadLand(){
 if(landState)return;landState=1;
 var s=document.createElement('script');
 s.src='https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js';
 s.onload=function(){
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json').then(function(r){return r.json()}).then(function(t){
   var f=topojson.feature(t,t.objects.land),d='';
   var geos=f.type=='FeatureCollection'?f.features.map(function(x){return x.geometry}):[f.geometry];
   function ring(r){for(var i=0;i<r.length;i++)d+=(i?'L':'M')+(r[i][0]+180).toFixed(1)+' '+(90-r[i][1]).toFixed(1);d+='Z'}
   geos.forEach(function(g){
    if(g.type=='Polygon')g.coordinates.forEach(ring);
    else if(g.type=='MultiPolygon')g.coordinates.forEach(function(p){p.forEach(ring)});
   });
   landPath=d;landState=2;if(tab=='world')render();
  }).catch(function(){landState=0});
 };
 s.onerror=function(){landState=0};
 document.head.appendChild(s);
}

function mapSvg(pts,zoom,r){
 var W=360,H=180,vb='0 0 360 180';
 if(zoom&&pts.length){
  var p0=pts[0],w=90,h=45;
  var x=Math.max(0,Math.min(W-w,p0.lon+180-w/2)),y=Math.max(0,Math.min(H-h,90-p0.lat-h/2));
  vb=x.toFixed(1)+' '+y.toFixed(1)+' '+w+' '+h;
 }
 var bg='';
 if(landPath)bg='<use href="#landp" fill="#fffaf2" stroke="#bcd9ee" stroke-width=".3"/>';
 else{
  for(var a=0;a<=W;a+=30)bg+='<line x1="'+a+'" y1="0" x2="'+a+'" y2="'+H+'" stroke="#fff" stroke-width=".6"/>';
  for(var b=0;b<=H;b+=30)bg+='<line x1="0" y1="'+b+'" x2="'+W+'" y2="'+b+'" stroke="#fff" stroke-width=".6"/>';
 }
 var dots=pts.map(function(p){
  var cx=(p.lon+180).toFixed(2),cy=(90-p.lat).toFixed(2);
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#f7a58c" stroke="#fff" stroke-width="'+(r*.35)+'"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.38)+'" fill="#fff"/>';
 }).join('');
 return '<svg viewBox="'+vb+'" width="100%" style="display:block;border-radius:14px;background:#dcecf7" role="img" aria-label="地圖">'+bg+dots+'</svg>';
}

function placeCard(p){
 return '<div class="card"><div id="ph" data-id="'+p.id+'" style="min-height:120px;border-radius:18px;background:#e6dcf5;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:13px;color:#8a84a0">📷 載入照片中…</div>'
 +'<div id="phc" style="font-size:12px;color:#8a84a0;margin:6px 0 0"></div>'
 +'<h3>'+esc(p.name)+' <span class="sm">'+esc(p.country)+'</span></h3><p>'+esc(p.story)+'</p>'
 +'<p>✨ <b>你知道嗎？</b><br>'+esc(p.fact)+'</p>'
 +'<b>📍 它在地球的哪裡？</b><div style="margin-top:6px">'+mapSvg([p],true,1.6)+'</div></div>';
}

function loadPhoto(p){
 var id=p.id;
 function show(d){
  var box=document.getElementById('ph'),cr=document.getElementById('phc');
  if(!box||box.dataset.id!=id)return;
  if(d&&d.thumbnail&&d.thumbnail.source){
   var small=d.thumbnail.source,big=small.replace(/\/(\d+)px-/,'/500px-');
   var img=document.createElement('img');
   img.alt=p.name;img.style.cssText='width:100%;height:190px;object-fit:cover;display:block';
   img.onerror=function(){img.onerror=null;img.src=small};
   img.src=big;
   box.innerHTML='';box.style.minHeight='0';box.appendChild(img);
   var page=d.content_urls&&d.content_urls.desktop?d.content_urls.desktop.page:'';
   cr.innerHTML='照片來源：'+(page?'<a href="'+page+'" target="_blank" style="color:#7d6aa8">Wikipedia／Wikimedia Commons</a>':'Wikipedia／Wikimedia Commons')+'，授權依原頁面標示';
  }else{box.textContent='（這個景點暫時沒有照片）'}
 }
 if(WK[id]!==undefined){show(WK[id]);return}
 fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(wikiOf(p).replace(/ /g,'_')))
  .then(function(r){return r.json()}).then(function(d){WK[id]=d;show(d)})
  .catch(function(){show(null)});
}

vWorld=function(){
 var n=count();
 var col=S.places.map(function(id){return PLACES.find(function(p){return p.id==id})}).filter(Boolean);
 var cur=PLACES.find(function(p){return p.id==S.lastP});
 var h='<h2>🌍 世界</h2>';
 if(landPath)h+='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="landp" fill-rule="evenodd" d="'+landPath+'"/></defs></svg>';
 if(n<3)h+='<div class="card c">🔒 今日完成 3 項習慣，就能抽新的景點<br>目前 '+n+' / 7</div>';
 else h+='<div class="c" style="margin-bottom:12px"><button class="main" data-a="draw2">抽一張世界美景</button><div class="sm" style="margin-top:6px">已探索 '+col.length+' / '+PLACES.length+'</div></div>';
 if(cur)h+=placeCard(cur);
 h+='<div class="card"><b>我的世界足跡地圖</b><div style="margin-top:8px">'+mapSvg(col,false,3)+'</div>'
  +'<p class="sm c">已探索 '+col.length+' 個景點 · '+new Set(col.map(function(p){return p.country})).size+' 個國家／地區<br>「點亮」代表在 App 抽到，不代表實際到訪</p></div>';
 col.slice().reverse().slice(0,showN).forEach(function(p){
  h+='<div class="card" style="padding:12px"><div class="row"><div style="flex:none;width:96px">'+mapSvg([p],true,3)+'</div>'
   +'<div style="flex:1;min-width:0"><b>'+esc(p.name)+'</b><div class="sm">'+esc(p.country)+'</div></div>'
   +'<button data-a="view2" data-v="'+p.id+'">重讀</button></div></div>';
 });
 if(col.length>showN)h+='<div class="c"><button data-a="more2">顯示更多</button></div>';
 return h;
};

var _render=render;
render=function(){_render();if(tab=='world'){loadLand();var c=PLACES.find(function(p){return p.id==S.lastP});if(c)loadPhoto(c)}};

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,v=el.dataset.v;
 if(a=='draw2'){
  if(count()<3)return;
  var left=PLACES.filter(function(p){return S.places.indexOf(p.id)<0});
  var pool=left.length?left:PLACES;
  var p=pool[Math.floor(Math.random()*pool.length)];
  S.lastP=p.id;if(S.places.indexOf(p.id)<0)S.places.push(p.id);
  save();render();scrollTo(0,0);
 }else if(a=='view2'){S.lastP=v;save();render();scrollTo(0,0)}
 else if(a=='more2'){showN+=30;render()}
});
})();

</script><script>
(function(){
var st=document.createElement('style');
st.textContent='@keyframes bdWig{0%,100%{transform:rotate(0)}30%{transform:rotate(-2deg)}60%{transform:rotate(2deg)}}'
+'.bd-hi{padding:0 8px;margin:-8px 0 16px;text-align:center;font-size:14px;color:#8a7fa6;letter-spacing:.5px}'
+'.bd-hi.w{animation:bdWig .4s ease}'
+'.bd-tip{font-size:13px;color:#8a7fa6;margin:8px 0 0;letter-spacing:.3px}'
+'.bd-toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#ffd3c4;color:#6b3f35;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0 6px 16px #f7b7a355;z-index:9;transition:opacity .4s;white-space:nowrap}';
document.head.appendChild(st);

function hello(){var h=new Date().getHours();
 if(h<5)return '夜深了，要早點休息喔 🌙';if(h<11)return '早安 ☀️';if(h<14)return '午安 🍙';if(h<18)return '午後好 🍵';return '晚上好 🌙';}
function streak(){var c=0,d=new Date();if(!count(key(d)))d.setDate(d.getDate()-1);while(count(key(d))>0){c++;d.setDate(d.getDate()-1)}return c}
function lines(){
 var n=count(),l2=Math.max(0,2-n),l3=Math.max(0,3-n),hi=hello();
 if(tab=='today'){
  if(n==0)return [hi+' 今天從一件小事開始就好',hi+' 先喝杯水，再慢慢打卡吧','今天也一起慢慢開花吧 🌸'];
  if(n==1)return ['好的開始！再一項就能解鎖話語 💌','第一朵花開了 🌸 再接再厲'];
  if(n==2)return ['話語解鎖了！再一項就能去環遊世界 🌍','做得好～世界正在等你'];
  if(n<7)return ['已經完成 '+n+' 項了，你好棒 ✨','剩下的隨心就好，不用勉強','今天的你，正在閃閃發光'];
  return ['七項全部完成！今天的你滿分 🎉','全部完成～給自己一個大大的擁抱 🤍'];
 }
 if(tab=='stats'){var s=streak();
  return [s>1?'已經連續記錄 '+s+' 天了，好厲害 🔥':'來看看這陣子的自己吧 📊','每一格都是你留下的足跡','不管高低起伏，都是成長的一部分'];}
 if(tab=='quote'){

function toast(n){
 var msg;
 if(n==2)msg='💌 話語解鎖了！';else if(n==3)msg='🌍 世界解鎖了！';else if(n==7)msg='🎉 七項全部完成！';
 else{var c=['🌸 太棒了！','✨ 又完成一項！','💗 做得好！','🎈 今天好認真！'];msg=c[Math.floor(Math.random()*c.length)]}
 var t=document.createElement('div');t.className='bd-toast';t.textContent=msg+' 目前 '+n+' / 7';
 document.body.appendChild(t);
 setTimeout(function(){t.style.opacity='0'},1600);setTimeout(function(){t.remove()},2100);
}
